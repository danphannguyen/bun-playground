services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/app/apps/backend:rw
      - /app/apps/backend/node_modules
      - /app/apps/backend/dist
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - API_PREFIX=api
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app/apps/frontend:rw
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/.next
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://backend:3001
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge