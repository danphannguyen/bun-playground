services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/app/apps/backend:rw
      - ./packages/shared:/app/packages/shared:ro
      - /app/apps/backend/node_modules:rw
      - /app/apps/backend/dist:rw
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - API_PREFIX=api
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app/apps/frontend:rw
      - ./packages/shared:/app/packages/shared:ro
      - /app/apps/frontend/node_modules:rw
      - /app/apps/frontend/.next:rw
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://backend:3001
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge